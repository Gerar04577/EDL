<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EDL">
<meta name="theme-color" content="#1f4e5f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">
<title>EDL — État des Lieux</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; padding: calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#1a1a1a; background:#f7f6f3; }
  h1 { font-size:20px; margin:0 0 2px; letter-spacing:-0.01em; }
  .sous { color:#6b6b6b; font-size:14px; margin:0 0 20px; }
  .bloc { background:#fff; border:1px solid #e3e0da; border-radius:12px; padding:15px 17px; margin-bottom:12px; }
  .bloc h2 { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:#8a8a8a; margin:0 0 10px; font-weight:600; }
  .ligne { display:flex; justify-content:space-between; gap:14px; padding:7px 0; border-bottom:1px solid #f0eeea; }
  .ligne:last-child { border-bottom:0; }
  .ligne span:first-child { color:#4a4a4a; }
  .val { font-weight:600; text-align:right; }
  .ok { color:#1f7a4d; } .ko { color:#b03030; }
  .note { color:#8a8a8a; font-size:13px; margin:9px 0 0; }
  /* Couleurs par fonction : avancer en vert, revenir en bleu, choisir en
     lavande, effacer en corail. Pastel pour rester lisible en plein soleil,
     vif pour être distingué d'un coup d'œil, gants aux mains. */
  button { width:100%; padding:14px; margin-top:9px; font-size:16px; font-weight:600;
    border-radius:10px; border:1px solid #2f7d63; background:#c9ecdb; color:#12503d;
    -webkit-appearance:none; }
  button:active { filter:brightness(.94); }
  button.secondaire { background:#dbe9f7; color:#1a4a80; border-color:#7fa9d4; }
  button.choix { background:#f0ecfa; color:#2e2352; border-color:#c3b6e6;
    text-align:left; font-weight:500; padding:13px 15px; }
  button.aide { background:#fdf0cf; color:#6b4d05; border-color:#ddb95a; }
  button.aide-titre { width:100%; text-align:left; background:#fdf0cf; color:#6b4d05;
    border-color:#ddb95a; margin:0; }
  .aide-texte { margin:10px 0 0; line-height:1.55; }
  button.choix .droite { float:right; color:#8a8a8a; font-weight:400; }
  button:disabled { opacity:.45; filter:grayscale(.5); }
  .avert { background:#fdf3e3; border:1px solid #e8d5ac; border-radius:12px; padding:15px 17px; margin-bottom:12px; }
  .avert strong { display:block; margin-bottom:5px; }
  .erreur { background:#fdeeee; border:1px solid #e8bcbc; border-radius:12px; padding:15px 17px; margin-bottom:12px; }
  .fil { color:#8a8a8a; font-size:13px; margin:0 0 14px; }
  .compteur { display:flex; align-items:center; gap:10px; margin-top:9px; }
  .compteur input { width:64px; padding:9px; font-size:16px; text-align:center;
    border:1px solid #e3e0da; border-radius:8px; -webkit-appearance:none; }
  .interrupteur { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #f0eeea; }
  .interrupteur:last-child { border-bottom:0; }
  .pied { color:#9a9a9a; font-size:12px; text-align:center; margin-top:18px; }
  .cache { display:none; }
  /* Vignettes des photographies d'entrée : assez grandes pour reconnaître
     la vue, assez petites pour en voir six d'un coup. */
  .vignettes { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .vignettes figure { margin:0; }
  .vignettes img { width:100%; aspect-ratio:3/4; object-fit:cover;
    border-radius:8px; display:block; background:#f0eeea; }
  .vignettes figcaption { font-size:12px; color:#8a8a8a; text-align:center;
    margin-top:3px; }
  /* Emplacement réservé tant que le lien n'est pas arrivé : sans lui, la
     grille se réorganiserait à chaque image chargée. */
  .vignette-vide { width:100%; aspect-ratio:3/4; border-radius:8px;
    background:#f0eeea; }
  .vignette.reprise img { outline:3px solid #2f7d63; outline-offset:-3px; }
  .vignette.reprise figcaption { color:#1f7a4d; font-weight:600; }
  .barre { position:sticky; top:0; z-index:5; margin:-6px -18px 12px; padding:9px 18px;
    font-size:13px; font-weight:600; text-align:center; }
  .barre-ok { background:#e8f3ec; color:#1f7a4d; }
  .barre-attente { background:#fdf3e3; color:#8a5a12; }
  .barre-neutre { background:#f0eeea; color:#8a8a8a; }
  .apercu { width:100%; height:340px; border:1px solid #e3e0da; border-radius:9px; margin-top:9px; }
  .signature { width:100%; height:110px; border:1px dashed #b9b4aa; border-radius:9px;
    background:#fff; touch-action:none; display:block; margin-top:8px; }
  .saisie-carte, .saisie-mail { width:170px; padding:9px; font-size:15px; text-align:right;
    border:1px solid #e3e0da; border-radius:8px; -webkit-appearance:none; }
  .saisie-index { width:130px; padding:9px; font-size:16px; text-align:right;
    border:1px solid #e3e0da; border-radius:8px; -webkit-appearance:none; }
  textarea { width:100%; padding:11px; font-size:16px; font-family:inherit;
    border:1px solid #e3e0da; border-radius:9px; margin-top:9px; -webkit-appearance:none; }
  .segments { display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
  .seg { width:auto; flex:1; margin:0; padding:9px 6px; font-size:13px; font-weight:500;
    background:#fff; color:#4a4a4a; border-color:#e3e0da; }
  .seg { background:#fff; }
  .seg.actif { background:#2f7d63; color:#fff; border-color:#2f7d63; }
  .constat { padding:9px 0; border-bottom:1px solid #f0eeea; }
  .constat p { margin:0; }
  .attention { color:#8a5a12; }
  .gris { color:#8a8a8a; }
  .comp { padding:2px 0 6px; border-bottom:1px solid #f0eeea; }
  .comp:last-child { border-bottom:0; }
  .comp .ligne { border-bottom:0; padding-bottom:2px; }
  .comp .note { margin-top:0; }
  .comp-alerte { background:#fdf7ef; margin:0 -8px; padding:4px 8px 7px; border-radius:7px; }
  .succes { background:#e8f3ec; border:1px solid #b9dcc7; color:#1f7a4d; border-radius:10px;
    padding:11px 15px; margin-bottom:12px; font-weight:600; font-size:14px; text-align:center; }
  .mini { width:auto; margin:7px 6px 2px 0; padding:8px 14px; font-size:13px; }
  .lien { color:#a83a3a; }
  button[data-suppr-photo], button[data-suppr], button[data-suppr-reserve],
  button[data-abandonner], button[data-suppr-ista] { color:#a83a3a; }
  button[data-abandonner].mini { background:#fbdfdf; border-color:#e0a0a0; color:#8d2b2b; }
  button[data-rectifier].mini { background:#fdf0cf; border-color:#ddb95a; color:#6b4d05; }
  #btn-confirmer, #btn-signer { background:#c9ecdb; border-color:#2f7d63; color:#12503d; }
  .sceau { display:inline-block; font-size:11px; font-weight:600; color:#1f7a4d;
    background:#e8f3ec; padding:2px 7px; border-radius:20px; vertical-align:middle; }
  code { background:#f0eeea; padding:1px 5px; border-radius:4px; font-size:13px; }
  button.choix.actif-choix { border-color:#6b4fbb; border-width:2px; background:#e3dbf8;
    font-weight:700; }
  .approuve { font-size:20px; font-weight:700; letter-spacing:.08em; text-align:center;
    color:#1f4e5f; margin:12px 0; }
  .duo { display:flex; gap:8px; }
  .duo .decrire { flex:1; }
  .decrire.sobre { background:#eef4fb; color:#3a6ea8; border-color:#c3d8ef; font-weight:500; }
  .decrire { width:100%; margin-top:9px; padding:13px; font-size:15px; font-weight:600;
    background:#d8e6fb; color:#12447d; border:1px solid #8fb6e6; border-radius:10px; }
  .decrire:disabled { opacity:.6; }
  .voile { position:fixed; inset:0; background:rgba(20,20,20,.45); z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:24px calc(18px + env(safe-area-inset-left)); }
  .boite { background:#fff; border-radius:14px; padding:20px 18px; max-width:420px; width:100%; }
  .boite h2 { font-size:17px; margin:0 0 8px; text-transform:none; letter-spacing:0; color:#1a1a1a; }
  .lien { width:auto; margin:0 0 0 8px; padding:0; background:none; border:none;
    color:#b03030; font-size:13px; font-weight:500; }
</style>
</head>
<body>

<h1 id="titre">EDL — État des Lieux</h1>
<p class="sous" id="sous-titre">Chargement…</p>

<div id="avertissement"></div>
<div id="vue"></div>

<p class="pied" id="pied"></p>

<script src="msal-browser.min.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script src="auth.js"></script>
<script src="graph.js"></script>
<script src="locataires.js"></script>
<script src="visite.js"></script>
<script src="releves.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="pdf.js"></script>
<script src="comparaison-edl.js"></script>
<script src="ia.js"></script>
<script src="finvisite.js"></script>
<script src="aide.js"></script>
<script src="comparaison.js"></script>
<script src="photos.js"></script>
<script src="app.js"></script>
<script>
/* Copie locale de l'application : sans elle, rien ne s'ouvre hors réseau.
   L'enregistrement est sans effet si le navigateur ne le gère pas, et il
   n'empêche jamais l'application de démarrer. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
